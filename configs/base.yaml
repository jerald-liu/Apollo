# Apollo Phase 1 — Base Training Config
# Target: single A100/H100 GPU, ~6-8 hours training

# Data
data_dir: data/processed
spectral: true

# Model — "Medium" config (14.8M params, 9.8ms inference @ ctx=128)
d_model: 384
nhead: 6
num_layers: 6
max_seq_len: 512
user_embed_dim: 0        # Phase 1: no user embeddings
spectral_dim: 21          # 5 note-level + 16 trajectory
n_timbre_outputs: 5       # brightness, attack, richness, warmth, flux
dropout: 0.1

# Training
batch_size: 64
lr: 3e-4
min_lr: 1e-5
warmup_steps: 1000
max_steps: 50000
weight_decay: 0.05
grad_clip: 1.0
timbre_loss_weight: 0.1   # MSE weight for timbral prediction head

# Mixed precision
use_amp: true

# Logging
log_interval: 50
eval_interval: 500
save_interval: 2000
output_dir: models
run_name: apollo_phase1_base
use_wandb: false
