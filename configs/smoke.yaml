# Smoke test — local MPS/CPU correctness verification.
# Uses existing MIDI-only preprocessed data (no download needed).
# Target: loss decreasing from ~5.94 by step 200. Runs in ~60s on MPS.

data_dir: data/processed
spectral: false        # no train_continuous.npy in MIDI-only preprocessed data

d_model: 128
nhead: 4
num_layers: 2
max_seq_len: 512       # must match preprocessed seq_len (data/processed/meta.json)
user_embed_dim: 0
spectral_dim: 21       # ignored when spectral: false
n_timbre_outputs: 5    # ignored when spectral: false
dropout: 0.0           # no dropout so loss signal is clean

batch_size: 4
lr: 3e-4
min_lr: 1e-5
warmup_steps: 20
max_steps: 200
weight_decay: 0.05
grad_clip: 1.0
timbre_loss_weight: 0.1

use_amp: false         # MPS bfloat16 autocast is flaky; skip for smoke test

log_interval: 10
eval_interval: 100
save_interval: 9999    # don't write checkpoints during smoke test
output_dir: models
run_name: apollo_smoke
use_wandb: false
