# Apollo Phase 1 — Large Training Config
# Target: A100 80GB or H100, ~12-16 hours training
# Use if base config underfits or you want maximum quality

# Data
data_dir: data/processed
spectral: true

# Model — Larger config (~50M params)
d_model: 512
nhead: 8
num_layers: 8
max_seq_len: 1024
user_embed_dim: 0
spectral_dim: 21
n_timbre_outputs: 5
dropout: 0.1

# Training
batch_size: 48            # Smaller batch to fit in memory
lr: 2e-4
min_lr: 1e-5
warmup_steps: 2000
max_steps: 100000
weight_decay: 0.05
grad_clip: 1.0
timbre_loss_weight: 0.15

# Mixed precision
use_amp: true

# Logging
log_interval: 50
eval_interval: 1000
save_interval: 5000
output_dir: models
run_name: apollo_phase1_large
use_wandb: false
