# Apollo v2 — Augmented training config
# Changes vs base.yaml:
#   - TransformerEncoder (decoder-only) replaces Decoder w/ dummy cross-attention
#   - Pitch ±6 semitone + velocity ±2 bin augmentation (~13× effective data)
#   - Label smoothing 0.1 — reduces memorization
#   - dropout 0.15, weight_decay 0.1 — stronger regularization for data-limited regime
#   - 80K steps — justified by augmented data diversity
#   - Full val set (no 50-batch cap)

# Data
data_dir: data/processed
spectral: false

# Model
d_model: 384
nhead: 6
num_layers: 6
max_seq_len: 512
user_embed_dim: 0
spectral_dim: 21
n_timbre_outputs: 5
dropout: 0.15

# Training
batch_size: 64
lr: 3e-4
min_lr: 1e-5
warmup_steps: 2000
max_steps: 80000
weight_decay: 0.1
grad_clip: 1.0
timbre_loss_weight: 0.1
label_smoothing: 0.1
pitch_aug_max: 6
velocity_aug_range: 2

# Mixed precision
use_amp: true

# Logging
log_interval: 50
eval_interval: 500
save_interval: 2000
output_dir: models
run_name: apollo_v2_augmented
use_wandb: false
