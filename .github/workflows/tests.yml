name: Tests

on:
  push:
    branches: ["call-and-response-v1"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let all suites finish even if one fails
      matrix:
        suite:
          - name: "unit"
            # Vocab, tokenizer, model architecture, checkpoint, split — all sub-second
            tests: >-
              tests/test_vocab_layout.py
              tests/test_tokenizer_roundtrip.py
              tests/test_mel_encoder.py
              tests/test_transformer.py
              tests/test_checkpoint.py
              tests/test_split_determinism.py
              tests/test_import_hygiene.py

          - name: "pipeline"
            # Ingest, mel extraction, error handling, packer, generate — need wav I/O
            tests: >-
              tests/test_ingest_smoke.py
              tests/test_mel_extractor.py
              tests/test_error_handling.py
              tests/test_packer.py
              tests/test_generate.py

          - name: "training"
            # Smoke train (50 epochs × 4 runs) + train_epoch + production train CLI
            # Slowest suite — runs in parallel so it doesn't block the others
            tests: >-
              tests/test_train.py
              tests/test_train_real.py
              tests/test_smoke_train.py

    name: "${{ matrix.suite.name }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # CPU-only torch — avoids ~2 GB CUDA wheel; MPS tests skip automatically
      - name: Install PyTorch (CPU)
        run: |
          pip install torch>=2.8.0 torchaudio>=2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run ${{ matrix.suite.name }} tests
        run: pytest --tb=short -v ${{ matrix.suite.tests }}
